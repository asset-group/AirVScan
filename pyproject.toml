[tool.ruff]
line-length = 99
exclude = [
    "backup",
    "wdissector.py",
]

[tool.ruff.lint]
select = ["F", "E", "W", "UP", "I"]
ignore = [
    "E501",  # formatting / long crash dumps and prompts
    "UP015", # personal preference, clearer to keep open mode
]

[tool.ruff.lint.per-file-ignores]
"data_prep/*" = ["E402"]
"evaluation/*" = ["E402"]
